// Naming: a nested message and the enum and oneof inside it, a message whose
// module is a keyword, and enums and messages from another package -- each
// has to be spelled where buffa put it.

syntax = "proto3";

package example.v1;

import "protoc/contrib/defaults/options.proto";
import "other/v1/catalog.proto";

message Outer {
  message Inner {
    enum Color {
      COLOR_UNSPECIFIED = 0;
      COLOR_RED = 1;
      COLOR_BLUE = 2;
    }

    Color color = 1 [(protoc.contrib.defaults.value).enum_name = "COLOR_BLUE"];

    oneof choice {
      option (protoc.contrib.defaults.oneof) = "label";
      string label = 2 [(protoc.contrib.defaults.value).string = "inner"];
      int32 count = 3;
    }
  }

  Inner inner = 1 [(protoc.contrib.defaults.value).message = {initialize: true, recurse: true}];
  other.v1.Tier tier = 2 [(protoc.contrib.defaults.value).enum_name = "TIER_GOLD"];
  other.v1.Shelf shelf = 3 [(protoc.contrib.defaults.value).message = {initialize: true, recurse: true}];
  // Has no defaults, so there is no `set_defaults` to recurse into: it is
  // initialized and left at that.
  other.v1.Plain plain = 4 [(protoc.contrib.defaults.value).message = {initialize: true, recurse: true}];
  repeated Inner inners = 5;
}

// buffa puts this message's nested items in `r#type`, since `type` is a
// keyword.
message Type {
  oneof kind {
    option (protoc.contrib.defaults.oneof) = "type";
    string name = 1;
    int64 type = 2 [(protoc.contrib.defaults.value).int64 = 5];
  }
}
