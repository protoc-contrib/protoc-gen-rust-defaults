// proto2 presence: every `optional` field is an `Option` and only `None` is
// unset, a `required` field is bare and its zero value is unset, and an enum
// is closed -- buffa types it as the enum itself, not `EnumValue<E>`.

syntax = "proto2";

package example.v1;

import "protoc/contrib/defaults/options.proto";

message Legacy {
  enum Level {
    LOW = 0;
    MEDIUM = 1;
    HIGH = 2;
  }

  optional int32 retries = 1 [(protoc.contrib.defaults.value).int32 = 3];
  optional string region = 2 [(protoc.contrib.defaults.value).string = "us-east1"];
  optional bytes token = 3 [(protoc.contrib.defaults.value).bytes = "abc"];
  optional Level level = 4 [(protoc.contrib.defaults.value).enum_name = "MEDIUM"];
  required uint64 budget = 5 [(protoc.contrib.defaults.value).uint64 = 1000000];
  required Level floor = 6 [(protoc.contrib.defaults.value).enum = 2];
  optional double ratio = 7 [(protoc.contrib.defaults.value).double = 0.5];
}
