// Edition 2023 presence: explicit unless a field says otherwise, so the same
// default is an `Option` check on one field and a zero check on the next. An
// enum is open unless it is declared closed.

edition = "2023";

package example.v1;

import "protoc_contrib/defaults/options.proto";

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_FAST = 1;
}

enum Strictness {
  option features.enum_type = CLOSED;

  STRICTNESS_OFF = 0;
  STRICTNESS_ON = 1;
}

message Edition {
  int32 explicit_count = 1 [(protoc_contrib.defaults.value).int32 = 7];
  int32 implicit_count = 2 [
    features.field_presence = IMPLICIT,
    (protoc_contrib.defaults.value).int32 = 8
  ];
  string implicit_name = 3 [
    features.field_presence = IMPLICIT,
    (protoc_contrib.defaults.value).string = "edition"
  ];
  Mode mode = 4 [(protoc_contrib.defaults.value).enum_name = "MODE_FAST"];
  Strictness strictness = 5 [(protoc_contrib.defaults.value).enum_name = "STRICTNESS_ON"];
}
