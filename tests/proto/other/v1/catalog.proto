// The other side of nested.proto's cross-package references.

syntax = "proto3";

package other.v1;

import "protoc_contrib/defaults/options.proto";

enum Tier {
  TIER_UNSPECIFIED = 0;
  TIER_SILVER = 1;
  TIER_GOLD = 2;
}

message Shelf {
  string aisle = 1 [(protoc_contrib.defaults.value).string = "A1"];
  Tier tier = 2 [(protoc_contrib.defaults.value).enum_name = "TIER_SILVER"];
}

message Plain {
  string note = 1;
}
