// Mounted the way grpc-rust-template mounts its output: `packaging=false`,
// the defaults included into the same module as buffa's types for the
// package, rather than into a tree of their own.

syntax = "proto3";

package inline.v1;

import "protoc/contrib/defaults/options.proto";

message ListBooksRequest {
  int32 page_size = 1 [(protoc.contrib.defaults.value).int32 = 50];
  string page_token = 2;
}

message Shelf {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    KIND_TALL = 1;
  }

  Kind kind = 1 [(protoc.contrib.defaults.value).enum_name = "KIND_TALL"];
  ListBooksRequest request = 2 [(protoc.contrib.defaults.value).message = {initialize: true, recurse: true}];

  oneof placement {
    option (protoc.contrib.defaults.oneof) = "wall";
    string wall = 3 [(protoc.contrib.defaults.value).string = "north"];
    string floor = 4;
  }
}
