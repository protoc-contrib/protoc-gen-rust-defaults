[package]
name = "defaults-fixture"
version = "0.2.0"
edition = "2024"
publish = false
description = "Compiles the test schema with both buffa and this plugin, so the generated code is type-checked and exercised as well as diffed against a golden file."

# The same lints the plugin holds itself to. Generated code is included into
# this crate, so a lint it trips is a lint a consumer would trip -- and several
# consumers in this ecosystem deny pedantic at the workspace level.
[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
buffa = "0.9.2"
# google.protobuf.{Duration,Timestamp,*Value}, which the schema defaults.
buffa-types = "0.9.2"
# google.protobuf.DescriptorProto, which the ported Go fixture recurses into to
# prove a foreign message is a no-op.
buffa-descriptor = "0.9.2"
# The trait the main schema's messages implement (`impl_trait`).
protoc-contrib = { path = "../../protoc_contrib" }

[build-dependencies]
# The plugin as a library rather than as a `protoc` plugin binary: a build
# script cannot depend on a binary from the same build, and going through the
# library exercises the same passes the binary does.
protoc-gen-rust-defaults = { path = "../.." }
buffa = "0.9.2"
buffa-build = "0.9.2"
buffa-codegen = "0.9.2"
anyhow = "1"
