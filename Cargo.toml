[workspace]
members = ["protoc_contrib", "tests/fixture"]

[package]
name = "protoc-gen-rust-defaults"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "protoc plugin that emits set_defaults() methods for buffa messages from protoc_contrib.defaults annotations."
repository = "https://github.com/protoc-contrib/protoc-gen-rust-defaults"
homepage = "https://github.com/protoc-contrib/protoc-gen-rust-defaults"
# Installed from GitHub -- the flake, the release binaries or `cargo install
# --git` -- rather than crates.io: it reads the options through the
# protoc-contrib crate beside their proto, which is GitHub-only too.
publish = false

[[bin]]
name = "protoc-gen-rust-defaults"
path = "src/main.rs"

[lib]
name = "protoc_gen_rust_defaults"
path = "src/lib.rs"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# The protoc_contrib.defaults options, compiled for buffa: the same types a
# consumer reads them with, so the plugin and its users cannot disagree on
# what an annotation says.
protoc-contrib = { path = "protoc_contrib" }
# The descriptor and plugin-protocol types, and the type-path resolution the
# generated code has to agree with. Pinned to the same minor as the buffa
# codegen whose output this extends -- an enum or oneof named by a different
# rule than buffa used is a compile error in the consumer, not here.
buffa = "0.9.2"
buffa-codegen = "0.9.2"
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
prettyplease = "0.3"
anyhow = "1"
# Timestamp literals are parsed at generation time, so a malformed one fails
# `buf generate` rather than compiling to a panic.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
