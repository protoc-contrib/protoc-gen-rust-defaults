[package]
name = "protoc-contrib-defaults"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "The protoc_contrib.defaults options compiled for buffa, and the SetDefaults trait protoc-gen-rust-defaults can implement."
repository = "https://github.com/protoc-contrib/protoc-gen-rust-defaults"
# Taken from GitHub, not crates.io: the Rust side of protoc-gen-go-defaults'
# `protoc_contrib/defaults` package, living beside the plugin as that one does.
publish = false

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# Keep on the minor the committed code in src/generated was generated for: it
# targets a specific runtime API, so a mismatch fails to compile rather than
# degrading.
buffa = "0.9.2"

[dev-dependencies]
# Regenerates src/generated, to check it is current; see tests/generated.rs.
buffa-build = "0.9.2"
